[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tragwerk"
version = "0.2.0"
description = "Verifiable structural analysis and Eurocode 2 checks for reinforced-concrete frames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
pdf = ["playwright>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "PyNiteFEA>=0.0.94"]

[project.scripts]
tragwerk = "tragwerk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tragwerk = ["report/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
