<style>
/* FE lab: plane stress / plane strain continuum. Shares the drafting-room tokens. */
#mode-fe .canvasfe { flex: 1; min-height: 340px; position: relative; overflow: hidden; background: var(--sheet); border-radius: 0 0 6px 6px; }
#mode-fe canvas.fe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#mode-fe .legendfe { position: absolute; left: 10px; top: 8px; max-width: min(520px, calc(100% - 20px)); font-size: 12px; color: var(--ink-2); pointer-events: none;
  background: color-mix(in srgb, var(--sheet) 86%, transparent); border-radius: 4px; padding: 4px 6px; }
#mode-fe .legendfe b { color: var(--ink); font-weight: 600; }
#mode-fe .bands { display: flex; height: 10px; width: 260px; max-width: 100%; margin-top: 4px; border-radius: 2px; overflow: hidden; }
#mode-fe .bands i { flex: 1; }
#mode-fe .bandticks { position: relative; width: 260px; max-width: 100%; height: 14px; font: 500 10.5px var(--font-num); color: var(--ink-3); }
#mode-fe .bandticks span { position: absolute; top: 1px; transform: translateX(-50%); white-space: nowrap; }
#mode-fe .bandticks span:first-child { transform: none; }
#mode-fe .bandticks span:last-child { transform: translateX(-100%); }
#mode-fe .toolsfe { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: 100%; font-size: 13px; color: var(--ink-2); }
#mode-fe .toolsfe label { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
#mode-fe .toolsfe input[type="number"] { width: 64px; height: 26px; border: 1px solid var(--rule); border-radius: 3px; background: var(--sheet); padding: 0 4px; font: 12.5px var(--font-num); }
#mode-fe .etypes { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
#mode-fe .etypes button { border: 0; border-right: 1px solid var(--rule); background: var(--sheet); height: 30px; cursor: pointer; font: 600 13px var(--font-num); color: var(--ink-2); }
#mode-fe .etypes button:last-child { border-right: 0; }
#mode-fe .etypes button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
#mode-fe .rows { display: flex; flex-direction: column; }
#mode-fe .frow { display: grid; gap: 6px; align-items: end; padding: 7px 0; border-top: 1px solid var(--rule-2); }
#mode-fe .frow.sup { grid-template-columns: 1.2fr .8fr .8fr auto auto 26px; }
#mode-fe .frow.ld { grid-template-columns: 1.25fr 1fr 1fr 1fr 26px; }
#mode-fe .frow.op { grid-template-columns: repeat(4, minmax(0, 1fr)) 26px; }
#mode-fe .frow .chk { display: flex; gap: 4px; align-items: center; height: 28px; font-size: 12.5px; color: var(--ink); }
#mode-fe .frow .chk input { width: 15px; height: 15px; margin: 0; }
#mode-fe .frow .icon-btn { align-self: center; }
#mode-fe .eq { font: 13px/1.6 var(--font-body); background: var(--paper); border-radius: 4px; padding: 8px 10px; overflow-x: auto; }
#mode-fe .eq div { white-space: nowrap; }
#mode-fe .eq .c { color: var(--ink-3); font-size: 11.5px; margin-left: 8px; }
#mode-fe .mat { overflow: auto; max-height: 300px; border: 1px solid var(--rule-2); border-radius: 4px; }
#mode-fe .mat table { border-collapse: collapse; font: 10.5px var(--font-num); }
#mode-fe .mat td, #mode-fe .mat th { padding: 2px 5px; text-align: right; white-space: nowrap; }
#mode-fe .mat th { color: var(--ink-3); font-weight: 500; position: sticky; top: 0; background: var(--sheet); }
#mode-fe .mat th.rh { position: sticky; left: 0; }
#mode-fe .sec { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
#mode-fe .sec h3 { margin: 0; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
#mode-fe .sec h3 span { font: 400 11.5px var(--font-body); color: var(--ink-3); }
#mode-fe .sec h3 b { font: inherit; }
#mode-fe .gsel { display: flex; gap: 3px; flex-wrap: wrap; }
#mode-fe .gsel button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 3px; padding: 1px 7px; cursor: pointer; font: 12px var(--font-num); }
#mode-fe .gsel button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
#mode-fe .cmp { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 12px; font-size: 12.5px; }
#mode-fe .cmp .v { font-family: var(--font-num); text-align: right; }
#mode-fe .cmp .h { color: var(--ink-3); font-size: 11.5px; }
#mode-fe .conv svg { width: 100%; height: auto; display: block; }
#mode-fe .conv text { font: 10.5px var(--font-num); fill: var(--ink-3); }
#mode-fe .tipfe { position: absolute; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 4; }
#mode-fe .busyfe { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 4px 12px; border-radius: 12px; font-size: 12px; z-index: 5; }
#mode-fe .bannerfe { position: absolute; left: 10px; right: 10px; bottom: 44px; padding: 8px 12px; border-radius: 5px; background: var(--bad-bg); color: var(--bad); font-weight: 500; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); z-index: 3; }
#mode-fe .viewsfe { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 2px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px; padding: 2px; z-index: 2; }
#mode-fe .viewsfe button { border: 0; background: transparent; padding: 3px 8px; font-size: 12px; cursor: pointer; border-radius: 3px; color: var(--ink-2); }
#mode-fe .viewsfe button:hover { color: var(--ink); }
@media (max-width: 760px) { #mode-fe .canvasfe { flex: none; height: 56vh; min-height: 340px; } }
</style>

<header class="bar">
  <div class="brand"><b>Tragwerk</b><span id="f-ver">v0.3</span></div>
  <div class="modes" role="tablist" aria-label="Workspace"><button role="tab" data-mode="3d" aria-selected="false">3D</button><button role="tab" data-mode="2d" aria-selected="false">2D frame</button><button role="tab" data-mode="fe" aria-selected="true">FE plate</button></div>
  <input id="f-name" class="model-name" aria-label="Model name" value="">
  <select id="f-preset" aria-label="Start from"></select>
  <button id="f-json" class="btn">Model JSON</button>
  <div class="verdict" id="f-verdict" aria-live="polite"></div>
</header>

<main class="bench bench3">
  <section class="pane editor" aria-label="Build the FE model">
    <div class="pane-hd"><div class="tabs" role="tablist">
      <button class="tab" role="tab" data-ftab="geom" aria-selected="true">Geometry</button>
      <button class="tab" role="tab" data-ftab="bc" aria-selected="false">Supports &amp; loads</button>
      <button class="tab" role="tab" data-ftab="mat" aria-selected="false">Material</button>
    </div></div>
    <div class="pane-bd" id="f-editor"></div>
  </section>

  <section class="pane draw" aria-label="Contour plot">
    <div class="pane-hd">
      <div class="chips" role="group" aria-label="Field" id="f-fields">
        <button class="chip" data-field="mesh">Mesh</button>
        <button class="chip" data-field="umag">|u|</button>
        <button class="chip" data-field="ux">u<sub>x</sub></button>
        <button class="chip" data-field="uy">u<sub>y</sub></button>
        <button class="chip" data-field="sxx">σ<sub>xx</sub></button>
        <button class="chip" data-field="syy">σ<sub>yy</sub></button>
        <button class="chip" data-field="txy">τ<sub>xy</sub></button>
        <button class="chip" data-field="s1">σ<sub>1</sub></button>
        <button class="chip" data-field="s2">σ<sub>2</sub></button>
        <button class="chip" data-field="mises">von Mises</button>
      </div>
      <div class="toolsfe">
        <label><input type="checkbox" id="f-def"> Deformed ×<input type="number" id="f-scale" min="0" step="any" aria-label="Deformation scale"></label>
        <label><input type="checkbox" id="f-mesh" checked> Mesh</label>
        <label><input type="checkbox" id="f-avg" checked> Averaged at nodes</label>
        <label><input type="checkbox" id="f-princ"> Principal directions</label>
      </div>
    </div>
    <div class="canvasfe" id="f-canvas">
      <canvas class="fe" aria-label="Finite element mesh and contour plot. Drag to pan, scroll or pinch to zoom, click an element to inspect it." role="img"></canvas>
      <div class="legendfe" id="f-legend"></div>
      <div class="viewsfe"><button id="f-fit" title="Fit the model in view">Fit</button></div>
      <div class="titleblock" id="f-title"></div>
      <div class="bannerfe" id="f-banner" hidden></div>
      <div class="tipfe" id="f-tip" hidden></div>
      <div class="busyfe" id="f-busy" hidden>Solving…</div>
    </div>
  </section>

  <section class="pane results" aria-label="FE results">
    <div class="rtabs" role="tablist">
      <button class="tab" role="tab" data-frtab="res" aria-selected="true">Results</button>
      <button class="tab" role="tab" data-frtab="elem" aria-selected="false">Element</button>
      <button class="tab" role="tab" data-frtab="conv" aria-selected="false">Convergence</button>
    </div>
    <div class="pane-bd" id="f-results"></div>
  </section>
</main>

<div class="drawer" id="f-drawer" hidden>
  <div class="drawer-in" role="dialog" aria-modal="true" aria-labelledby="f-drawer-title">
    <div class="row" style="justify-content:space-between"><h2 id="f-drawer-title">FE model JSON</h2><button class="btn" id="f-drawer-close">Close</button></div>
    <p class="hint">The open <span class="num">tragwerk-fe/0.1</span> format. Run it with <span class="num">tragwerk run model.json --json results.json</span> or POST it to <span class="num">/v1/analyze</span>; paste a model here to load it.</p>
    <textarea id="f-json-text" spellcheck="false" aria-label="FE model JSON"></textarea>
    <div class="row"><button class="btn primary" id="f-json-copy">Copy</button><button class="btn" id="f-json-load">Load pasted model</button><span class="hint" id="f-json-msg"></span></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const T = window.Tragwerk, FE = T.FE;
  const ROOT = document.getElementById("mode-fe");
  const $ = (s, el = ROOT) => el.querySelector(s);
  const $$ = (s, el = ROOT) => Array.from(el.querySelectorAll(s));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const fmt = (v, d = 3) => (v == null || !isFinite(v) ? "–" : Math.abs(v) >= 1e5 || (Math.abs(v) < 1e-3 && v !== 0) ? v.toExponential(2) : (+v.toPrecision(d + 1)).toString());
  const fx = (v, d = 3) => (v == null || !isFinite(v) ? "–" : v.toFixed(d));
  const opt = (v, l, cur) => `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(l)}</option>`;

  const PRESETS = {
    wall: { label: "Shear wall with a door opening", model: { schema: FE.SCHEMA_FE, name: "Shear wall with a door opening", analysis: "plane_stress", element: "Q8",
      material: { E_MPa: 33000, nu: 0.2, thickness_m: 0.25, density_kNm3: 25 },
      geometry: { type: "rectangle", Lx: 6, Ly: 3, h: 0.25, openings: [{ x0: 2.4, y0: 0, x1: 3.4, y1: 2.2 }] },
      supports: [{ edge: "bottom", ux: true, uy: true }], loads: [{ edge: "top", qx: 0, qy: -120 }, { edge: "left", qx: 25, qy: 0 }], self_weight: true }, field: "mises" },
    deep: { label: "Transfer deep beam on two columns", model: { schema: FE.SCHEMA_FE, name: "Transfer deep beam, column load at midspan", analysis: "plane_stress", element: "Q8",
      material: { E_MPa: 33000, nu: 0.2, thickness_m: 0.4, density_kNm3: 25 },
      geometry: { type: "rectangle", Lx: 6, Ly: 3, h: 0.2, openings: [] },
      supports: [{ edge: "bottom", from: 0, to: 0.4, ux: true, uy: true }, { edge: "bottom", from: 5.6, to: 6, uy: true }],
      loads: [{ edge: "top", from: 2.8, to: 3.2, qx: 0, qy: -5000 }, { edge: "top", qx: 0, qy: -40 }], self_weight: true }, field: "s2", princ: true },
    cantilever: { label: "Cantilever with end shear (Timoshenko)", model: { schema: FE.SCHEMA_FE, name: "Cantilever with a parabolic end shear", analysis: "plane_stress", element: "Q8",
      material: { E_MPa: 30000, nu: 0.25, thickness_m: 0.3, density_kNm3: 0 },
      geometry: { type: "rectangle", Lx: 8, Ly: 1, h: 0.25, openings: [] },
      supports: [{ edge: "left", ux: true, uy: true }], loads: [{ edge: "right", profile: "parabolic", P: -100, dir: "y" }], self_weight: false }, field: "sxx" },
    kirsch: { label: "Plate with a circular hole (Kirsch)", model: { schema: FE.SCHEMA_FE, name: "Steel plate with a hole, quarter model", analysis: "plane_stress", element: "Q8",
      material: { E_MPa: 210000, nu: 0.3, thickness_m: 0.02, density_kNm3: 0 },
      geometry: { type: "plate_hole", W: 10, a: 1, n_theta: 8, n_r: 10, grading: 1.6 },
      supports: [{ edge: "left", ux: true, uy: false }, { edge: "bottom", ux: false, uy: true }], loads: [{ edge: "right", qx: 2000, qy: 0 }], self_weight: false }, field: "sxx" },
  };
  const FIELDS = {
    mesh: { label: "Mesh" }, umag: { label: "|u|", unit: "mm", seq: true, k: 1000 }, ux: { label: "u<sub>x</sub>", unit: "mm", k: 1000 }, uy: { label: "u<sub>y</sub>", unit: "mm", k: 1000 },
    sxx: { label: "σ<sub>xx</sub>", unit: "MPa" }, syy: { label: "σ<sub>yy</sub>", unit: "MPa" }, txy: { label: "τ<sub>xy</sub>", unit: "MPa" },
    s1: { label: "σ<sub>1</sub>, major principal", unit: "MPa" }, s2: { label: "σ<sub>2</sub>, minor principal", unit: "MPa" }, mises: { label: "von Mises", unit: "MPa", seq: true },
  };
  const DESCR = {
    T3: "3-node constant strain triangle (CST): linear N, 1 Gauss point; stiff in bending.",
    T6: "6-node linear strain triangle (LST): quadratic N, 3 Gauss points.",
    Q4: "4-node bilinear quadrilateral: 2 × 2 Gauss points; shear locking in bending.",
    Q8: "8-node serendipity quadrilateral: quadratic N, 3 × 3 Gauss points; curved edges.",
  };
  const S = { model: null, preset: "wall", ftab: "geom", frtab: "res", field: "mises", def: false, scale: null, meshOn: true, avg: true, princ: false,
    res: null, err: null, sel: null, gsel: 0, conv: null, view: null };

  // ------------------------------------------------------------ solve
  let timer = null;
  function schedule(delay = 250) { clearTimeout(timer); $("#f-busy").hidden = false; timer = setTimeout(solve, delay); }
  function solve() {
    clearTimeout(timer);
    try {
      const m = FE.parseFE(S.model);
      if (m.nodes.length > 20000) throw new FE.FEError(`${m.nodes.length} nodes: the browser lab handles up to 20 000; coarsen the mesh or use the Python package.`);
      S.res = FE.solveFE(m); S.err = null;
      if (S.sel != null && S.sel >= m.elements.length) S.sel = null;
    } catch (e) { S.res = null; S.err = e.message; }
    $("#f-busy").hidden = true;
    S.scale = null;
    renderHeader(); renderEditorHints(); renderResults(); P.rebuild();
  }
  function load(key, model) {
    S.preset = key;
    const p = PRESETS[key];
    S.model = clone(model || p.model);
    if (p && !model) { S.field = p.field; S.princ = !!p.princ; }
    S.sel = null; S.conv = null; S.view = null;
    $("#f-princ").checked = S.princ;
    $$("[data-field]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.field === S.field)));
    renderEditor(); solve(); P.fit();
  }

  // ------------------------------------------------------------ header
  function renderHeader() {
    const name = $("#f-name");
    if (document.activeElement !== name) name.value = S.model.name || "";
    const v = $("#f-verdict"), r = S.res;
    if (!r) { v.innerHTML = `<span class="lbl">Cannot solve</span>`; return; }
    const vm = r.field("mises"), um = r.field("umag");
    v.innerHTML = `<span class="eta">${fx(Math.max(...vm), 2)}</span><span class="lbl">max σ<sub>vM</sub> MPa<br>|u| ${fx(1000 * Math.max(...um), 3)} mm</span>`;
  }

  // ------------------------------------------------------------ editor
  const numIn = (attr, v, step = "any", extra = "") => `<input type="number" step="${step}" ${attr} value="${esc(v ?? "")}" ${extra}>`;
  function edgesFor() { return S.model.geometry.type === "plate_hole" ? ["left", "right", "bottom", "top", "hole"] : ["left", "right", "bottom", "top"]; }
  function renderEditor() {
    $$("[data-ftab]").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.ftab === S.ftab)));
    const ed = $("#f-editor"), m = S.model, g = m.geometry;
    if (S.ftab === "geom") {
      ed.innerHTML = `<div class="tabpanel">
        <div class="group"><h3>Shape</h3>
          <label class="field">Geometry<select id="f-gtype">${opt("rectangle", "Rectangle with openings (wall, deep beam, beam)", g.type)}${opt("plate_hole", "Square plate with a central hole (quarter model)", g.type)}</select></label>
          ${g.type === "rectangle" ? `<div class="grid3"><label class="field"><span>L<sub>x</sub> (m)</span>${numIn('data-g="Lx"', g.Lx, 0.1, 'min="0.1"')}</label><label class="field"><span>L<sub>y</sub> (m)</span>${numIn('data-g="Ly"', g.Ly, 0.1, 'min="0.1"')}</label><span></span></div>
            <div class="subhd">Openings (m)</div>
            <div class="rows">${(g.openings || []).map((o, k) => `<div class="frow op">${["x0", "y0", "x1", "y1"].map((q) => `<label class="field">${q}${numIn(`data-op="${k}" data-k="${q}"`, o[q], 0.1)}</label>`).join("")}<button class="icon-btn" data-delop="${k}" aria-label="Remove opening ${k + 1}">×</button></div>`).join("")}</div>
            <div><button class="btn sm" id="f-addop">Add opening</button></div>`
          : `<div class="grid3"><label class="field">Half width W (m)${numIn('data-g="W"', g.W, 0.5, 'min="0.1"')}</label><label class="field">Hole radius a (m)${numIn('data-g="a"', g.a, 0.1, 'min="0.01"')}</label><span></span></div>
             <p class="hint">A quarter of a 2W × 2W plate: give the left and bottom edges symmetry supports (u<sub>x</sub> = 0 and u<sub>y</sub> = 0). The hole edge is curved: with T6 and Q8 the midside nodes sit on the arc, an isoparametric curved boundary.</p>`}
        </div>
        <div class="group"><h3>Elements</h3>
          <div class="etypes" role="group" aria-label="Element type">${FE.TYPES.map((t) => `<button data-et="${t}" aria-pressed="${m.element === t}">${t}</button>`).join("")}</div>
          <p class="hint">${DESCR[m.element]}</p>
          ${g.type === "rectangle" ? `<div class="fieldrow"><label class="field">Element size h (m)${numIn('data-g="h"', g.h, 0.05, 'min="0.01"')}</label><span class="stepper"><button data-hstep="2" aria-label="Coarser mesh">−</button><button data-hstep="0.5" aria-label="Finer mesh">+</button></span></div>`
          : `<div class="grid3"><label class="field"><span>n<sub>θ</sub> per 45°</span>${numIn('data-g="n_theta"', g.n_theta, 1, 'min="1" max="60"')}</label><label class="field"><span>n<sub>r</sub> radial</span>${numIn('data-g="n_r"', g.n_r, 1, 'min="1" max="60"')}</label><label class="field">Grading${numIn('data-g="grading"', g.grading ?? 1.6, 0.1, 'min="1" max="4"')}</label></div>
             <div><span class="stepper"><button data-nstep="0.5" aria-label="Coarser mesh">−</button><button data-nstep="2" aria-label="Finer mesh">+</button></span> <span class="hint">halve or double the divisions</span></div>`}
          <p class="hint" id="f-meshsum"></p>
        </div>
      </div>`;
    } else if (S.ftab === "bc") {
      const E = edgesFor(), edgeSel = (attr, cur) => `<select ${attr}>${E.map((e) => opt(e, e, cur)).join("")}</select>`;
      const sup = (m.supports || []).map((s, k) => `<div class="frow sup">
          <label class="field">Edge${"at" in s ? `<input value="point ${esc(s.at.join(", "))}" disabled>` : edgeSel(`data-sup="${k}" data-k="edge"`, s.edge)}</label>
          <label class="field">from${numIn(`data-sup="${k}" data-k="from"`, s.from, 0.1, 'placeholder="start"')}</label><label class="field">to${numIn(`data-sup="${k}" data-k="to"`, s.to, 0.1, 'placeholder="end"')}</label>
          <label class="chk"><input type="checkbox" data-sup="${k}" data-k="ux" ${s.ux === true ? "checked" : ""}>u<sub>x</sub></label><label class="chk"><input type="checkbox" data-sup="${k}" data-k="uy" ${s.uy === true ? "checked" : ""}>u<sub>y</sub></label>
          <button class="icon-btn" data-delsup="${k}" aria-label="Remove support ${k + 1}">×</button></div>`).join("");
      const lds = (m.loads || []).map((l, k) => {
        const kind = "at" in l ? "point" : l.profile === "parabolic" ? "parabolic" : "edge";
        const where = kind === "point" ? `<label class="field">x (m)${numIn(`data-ld="${k}" data-k="ax"`, l.at[0], 0.1)}</label><label class="field">y (m)${numIn(`data-ld="${k}" data-k="ay"`, l.at[1], 0.1)}</label>`
          : `<label class="field">Edge${edgeSel(`data-ld="${k}" data-k="edge"`, l.edge)}</label>${kind === "edge" ? `<label class="field">from / to${`<span style="display:flex;gap:3px">${numIn(`data-ld="${k}" data-k="from"`, l.from, 0.1, 'placeholder="start" aria-label="from"')}${numIn(`data-ld="${k}" data-k="to"`, l.to, 0.1, 'placeholder="end" aria-label="to"')}</span>`}</label>` : "<span></span>"}`;
        const vals = kind === "point" ? `<label class="field"><span>F<sub>x</sub> kN</span>${numIn(`data-ld="${k}" data-k="fx"`, l.fx ?? 0, 1)}</label><label class="field"><span>F<sub>y</sub> kN</span>${numIn(`data-ld="${k}" data-k="fy"`, l.fy ?? 0, 1)}</label>`
          : kind === "parabolic" ? `<label class="field">P kN, ${l.dir === "x" ? "x" : "y"}${numIn(`data-ld="${k}" data-k="P"`, l.P, 1)}</label><span></span>`

    $("#f-json-copy").onclick = () => { const t = $("#f-json-text"); navigator.clipboard.writeText(t.value).then(() => { $("#f-json-msg").textContent = "Copied."; }, () => { t.select(); $("#f-json-msg").textContent = "Select all and copy with your keyboard."; }); };
    $("#f-json-load").onclick = () => {
      try { const d = JSON.parse($("#f-json-text").value); FE.parseFE(d); load("custom", d); $("#f-drawer").hidden = true; }
      catch (e) { $("#f-json-msg").textContent = `Not loaded: ${e.message}`; }
    };
    document.addEventListener("keydown", (e) => { if (ROOT.hidden) return; if (e.key === "Escape") { if (!$("#f-drawer").hidden) $("#f-drawer").hidden = true; else if (S.sel != null) { S.sel = null; renderResults(); P.draw(); } } });
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (mq && mq.addEventListener) mq.addEventListener("change", () => P.theme());
    new MutationObserver(() => P.theme()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    $("#f-ver").textContent = `v${T.VERSION}`;
    P.bind();
    $("#f-def").checked = S.def; $("#f-mesh").checked = S.meshOn; $("#f-avg").checked = S.avg;
    load("wall");
    window.TragwerkFE = { S, P, load, solve, runConvergence, render: () => { renderEditor(); renderResults(); P.rebuild(); } };
  }
  init();
})();
</script>
