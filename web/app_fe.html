<style>

#mode-fe .seg3 button:last-child { border-right: 0; }

#mode-fe .frow.rb { grid-template-columns: .8fr .9fr 1fr .9fr 26px; }

#mode-fe .gsel { display: flex; gap: 3px; flex-wrap: wrap; }

#mode-fe .cmp .h { color: var(--ink-3); font-size: 11.5px; }
#mode-fe .conv svg, #mode-fe svg.chart { width: 100%; height: auto; display: block; }
#mode-fe .conv text, #mode-fe svg.chart text { font: 10.5px var(--font-num); fill: var(--ink-3); }
#mode-fe svg.chart .lab { fill: var(--ink-2); }
#mode-fe .tipfe { position: absolute; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 4; }
#mode-fe .busyfe { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 4px 12px; border-radius: 12px; font-size: 12px; z-index: 5; }
#mode-fe .bannerfe { position: absolute; left: 10px; right: 10px; bottom: 50px; padding: 8px 12px; border-radius: 5px; background: var(--bad-bg); color: var(--bad); font-weight: 500; border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); z-index: 3; }
#mode-fe .viewsfe { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 2px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px; padding: 2px; z-index: 2; }

#mode-fe .viewsfe button:hover { color: var(--ink); }
#mode-fe .timeline { position: absolute; left: 60px; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px; padding: 3px 8px; z-index: 2; font: 12px var(--font-num); color: var(--ink-2); }
#mode-fe .timeline input[type="range"] { flex: 1; min-width: 60px; }
#mode-fe .timeline button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 3px; width: 28px; height: 24px; cursor: pointer; color: var(--ink); }
#mode-fe .timeline .tl-lab { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#mode-fe .srcbar { display: flex; gap: 8px; align-items: center; width: 100%; flex-wrap: wrap; }
#mode-fe .srcbar .seg button { height: 26px; }
#mode-fe .layers { display: inline-flex; gap: 8px; flex-wrap: wrap; }
#mode-fe .run { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#mode-fe .run .btn.primary { min-width: 120px; }
#mode-fe #f-preset { max-width: 360px; min-width: 0; text-overflow: ellipsis; }
#mode-fe .prog { height: 6px; border-radius: 3px; background: var(--rule-2); overflow: hidden; flex: 1; min-width: 80px; }
#mode-fe .prog i { display: block; height: 100%; background: var(--ink); width: 0; }
#mode-fe .stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
#mode-fe .stat div { background: var(--paper); border-radius: 4px; padding: 6px 8px; }
#mode-fe .stat b { display: block; font: 600 17px var(--font-num); color: var(--ink); }
#mode-fe .stat span { font-size: 11px; color: var(--ink-3); }

<header class="bar">
  <div class="brand"><b>Tragwerk</b><span id="f-ver">v0.4</span></div>
  <div class="modes" role="tablist" aria-label="Workspace"><button role="tab" data-mode="3d" aria-selected="false">3D</button><button role="tab" data-mode="2d" aria-selected="false">2D frame</button><button role="tab" data-mode="fe" aria-selected="true">FE plate</button></div>
  <input id="f-name" class="model-name" aria-label="Model name" value="">
  <select id="f-preset" aria-label="Start from"></select>
  <button id="f-json" class="btn">Model JSON</button>
  <div class="verdict" id="f-verdict" aria-live="polite"></div>
</header>

<main class="bench bench3">
  <section class="pane editor" aria-label="Build the FE model">
    <div class="pane-hd"><div class="tabs" role="tablist">
      <button class="tab" role="tab" data-ftab="geom" aria-selected="true">Geometry</button>
      <button class="tab" role="tab" data-ftab="bc" aria-selected="false">Loads</button>
      <button class="tab" role="tab" data-ftab="mat" aria-selected="false">Material</button>
      <button class="tab" role="tab" data-ftab="reinf" aria-selected="false">Rebar</button>
      <button class="tab" role="tab" data-ftab="an" aria-selected="false">Analysis</button>
    </div></div>
    <div class="pane-bd" id="f-editor"></div>
  </section>

  <section class="pane draw" aria-label="Contour plot">
    <div class="pane-hd">
      <div class="srcbar">
        <span class="seg" role="group" aria-label="Results to show" id="f-src">
          <button data-src="lin" aria-pressed="true">Linear</button><button data-src="des">Design</button><button data-src="nl">Nonlinear</button><button data-src="dyn">Dynamic</button>
        </span>
        <span class="hint" id="f-srchint"></span>
      </div>
      <div class="chips" role="group" aria-label="Field" id="f-fields"></div>
      <div class="toolsfe">
        <label><input type="checkbox" id="f-def"> Deformed ×<input type="number" id="f-scale" min="0" step="any" aria-label="Deformation scale"></label>
        <label><input type="checkbox" id="f-mesh" checked> Mesh</label>
        <label><input type="checkbox" id="f-avg" checked> Averaged</label>
        <label><input type="checkbox" id="f-princ"> Principal directions</label>
        <span class="layers" id="f-layers">
          <label><input type="checkbox" data-layer="cracks" checked> Cracks</label>
          <label><input type="checkbox" data-layer="yield" checked> Yield / crushing</label>
          <label><input type="checkbox" data-layer="rebar"> Rebar</label>
        </span>
      </div>
    </div>
    <div class="canvasfe" id="f-canvas">
      <canvas class="fe" aria-label="Finite element mesh and contour plot. Drag to pan, scroll or pinch to zoom, click an element to inspect it." role="img"></canvas>
      <div class="legendfe" id="f-legend"></div>
      <div class="viewsfe"><button id="f-fit" title="Fit the model in view">Fit</button></div>
      <div class="timeline" id="f-timeline" hidden>
        <button id="f-play" aria-label="Play">▶</button>
        <input type="range" id="f-step" min="0" max="0" value="0" aria-label="Step">
        <span class="tl-lab" id="f-steplab"></span>
      </div>
      <div class="titleblock" id="f-title"></div>
      <div class="bannerfe" id="f-banner" hidden></div>
      <div class="tipfe" id="f-tip" hidden></div>
      <div class="busyfe" id="f-busy" hidden>Solving…</div>
    </div>
  </section>

  <section class="pane results" aria-label="FE results">
    <div class="rtabs" role="tablist">
      <button class="tab" role="tab" data-frtab="res" aria-selected="true">Results</button>
      <button class="tab" role="tab" data-frtab="des" aria-selected="false">Design</button>
      <button class="tab" role="tab" data-frtab="nl" aria-selected="false">Nonlinear</button>
      <button class="tab" role="tab" data-frtab="dyn" aria-selected="false">Dynamics</button>
      <button class="tab" role="tab" data-frtab="elem" aria-selected="false">Element</button>
      <button class="tab" role="tab" data-frtab="conv" aria-selected="false">Mesh</button>
    </div>
    <div class="pane-bd" id="f-results"></div>
  </section>
</main>

<div class="drawer" id="f-drawer" hidden>
  <div class="drawer-in" role="dialog" aria-modal="true" aria-labelledby="f-drawer-title">
    <div class="row" style="justify-content:space-between"><h2 id="f-drawer-title">FE model JSON</h2><button class="btn" id="f-drawer-close">Close</button></div>
    <p class="hint">Your complete finite element model. Download a copy to keep your work, or paste a saved FE model below and load it.</p>
    <textarea id="f-json-text" spellcheck="false" aria-label="FE model JSON"></textarea>
    <div class="row"><button class="btn primary" id="f-json-copy">Copy</button><button class="btn" id="f-json-load">Load pasted model</button><span class="hint" id="f-json-msg"></span></div>
  </div>
</div>

  const opt = (v, l, cur) => `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(l)}</option>`;
  const amax = (a) => { let v = -Infinity; for (const x of a) if (x > v) v = x; return v; };

          ${a.geometric ? `<div>F = I + ∂u/∂X,  E = ½(FᵀF − I),  S = C E,  K<sub>T</sub> = ∫B<sub>L</sub>ᵀ C B<sub>L</sub> + ∫Gᵀ Ŝ G <span class="c">material + geometric stiffness</span></div>` : ""}</div>

    $$("[data-mtc]", ed).forEach((el) => el.addEventListener("change", () => { const k = el.dataset.mtc; m.material[k] = k === "fck_MPa" ? Number(el.value) : el.value; renderEditor(); changed(30); }));

  // ------------------------------------------------------------ nonlinear run
  function nlOptions() {
    const a = S.an, o = { geometric: !!a.geometric && matKind() === "elastic", combination: a.combination, load_pattern: a.load_pattern || "all", control: a.control, iteration: a.iteration, steps: Math.max(1, Math.round(a.steps)),
      lam_max: a.lam_max, to_failure: !!a.to_failure, max_steps: Math.max(1, Math.round(a.max_steps)) };
    if (a.max_bisections) o.max_bisections = a.max_bisections;
    if (a.tol != null && isFinite(a.tol) && a.tol > 0) o.tol = a.tol;
    return o;
  }
  function runNonlinear() {
    let m;
    try { m = FE.parseFE(S.model); } catch (e) { S.err = e.message; renderResults(); return; }
    const opts = nlOptions(), model = clone(S.model);
    S.nlRun = { lam: 0, target: opts.to_failure ? Math.max(opts.lam_max, 1) : opts.lam_max, curve: [[0, 0]], t0: now() };
    S.frtab = "nl"; renderEditor(); renderResults();
    runJob("nl", { model, opts }, (p) => {
      if (!S.nlRun) return;
      S.nlRun.lam = p.lam; S.nlRun.curve.push([p.lam, p.monitor]); S.nlRun.it = p.iterations;
      if (S.ftab === "an") { const pr = $(".prog i"); if (pr) pr.style.width = `${Math.min(100, 100 * p.lam / Math.max(S.nlRun.target, 1e-9))}%`; const h = $(".run .hint"); if (h) h.textContent = `λ = ${fmt(p.lam, 4)}`; }
      if (S.frtab === "nl") { const c = $("#f-nlchart"); if (c) c.innerHTML = nlChart(S.nlRun.curve, null, null); }
    }).then((res) => {
      const full = res.steps.map((s, k) => (s.full ? k : -1)).filter((k) => k >= 0);

        ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[0] - ux * 6 - uy * 3, q[1] - uy * 6 + ux * 3); ctx.lineTo(q[0] - ux * 6 + uy * 3, q[1] - uy * 6 - ux * 3); ctx.closePath(); ctx.fill();
      }
    }
    function renderLegend() {
      const el = $("#f-legend"), r = R;
      const ban = $("#f-banner");
      const banner = S.err || (S.src === "nl" && S.nl && S.nl.stale ? "The model has changed since this nonlinear analysis: run it again." : "") || (S.src === "dyn" && S.dyn.fe && S.dyn.fe.stale ? "The model has changed since this time history: run it again." : "");
      ban.hidden = !banner; ban.textContent = banner;
      if (!r) { el.innerHTML = ""; return; }
      const state = r.extra && r.gp ? (r.extra.e1 ? `<br><i class="sw" style="background:#c4541c"></i>open crack (width ∝ w)<i class="sw" style="background:#d0021b"></i>w > w<sub>max</sub><i class="sw" style="background:#9aa3ad"></i>closed<i class="dot" style="background:#7b2cbf"></i>bar yielded<b style="margin-left:8px">×</b> crushed` : r.extra.alpha ? `<br><i class="dot" style="background:#7b2cbf;border-radius:50%"></i>yielding now` : "") : "";
      const tag = r.label ? ` · <b>${esc(r.label)}</b>` : "";
      if (!tris || !tris.band) {
        el.innerHTML = `<b>Mesh</b>: ${r.model.elements.length} ${r.model.etype} elements, ${r.model.nodes.length} nodes${tag}${S.def ? ` · deformed ×${fmt(S.scale)}` : ""}${state}<br>Drag to pan · scroll or pinch to zoom · click an element to inspect it`;
        return;
      }
      const { levels, color, NB, lo, hi } = tris.band, f = FIELDS[S.field];
      const tick = (v) => fmt(Math.abs(v) < 1e-9 * (Math.abs(lo) + Math.abs(hi)) ? 0 : v, 3);
      const ticks = [0, NB / 4, NB / 2, 3 * NB / 4, NB].map((k) => `<span style="left:${100 * k / NB}%">${tick(levels[k])}</span>`).join("");
      el.innerHTML = `<b>${f.label}</b> ${f.unit}${!f.elem && S.field[0] !== "u" ? (S.avg ? ", averaged at nodes" : ", element by element") : f.elem ? ", per element" : ""}${tag} · min <b class="num">${fmt(lo, 4)}</b>, max <b class="num">${fmt(hi, 4)}</b>${S.def ? ` · deformed ×${fmt(S.scale)}` : ""}
        <div class="bands">${Array.from({ length: NB }, (_, k) => `<i style="background:${color(k)}"></i>`).join("")}</div><div class="bandticks">${ticks}</div>
        ${S.princ ? `<span><i style="display:inline-block;width:14px;height:2px;background:#c62f22;vertical-align:middle"></i> tension <i style="display:inline-block;width:14px;height:2px;background:#1f5fa8;vertical-align:middle;margin-left:8px"></i> compression, principal directions</span>` : ""}${state}`;
    }
    function renderTitle() {
      const r = R, el = $("#f-title");
      if (!r) { el.innerHTML = ""; return; }
      const m = r.model, bb = bounds(), kind = matKind();
      const theory = (m.analysis === "plane_stress" ? "Plane stress" : "Plane strain") + ", " + (S.src === "nl" && S.nl ? (S.nl.kind === "rc" ? "RC, nonlinear" : S.nl.kind === "j2" ? "J2 plasticity" : S.nl.options.geometric ? "large deflection" : "nonlinear") : S.src === "dyn" ? "time history" : S.src === "des" ? "ULS design" : "linear elastic");
      el.innerHTML = `<div class="tb-name">${esc(S.model.name || "FE model")}</div><div>Size</div><div class="num">${fx(bb.hi[0] - bb.lo[0], 2)} × ${fx(bb.hi[1] - bb.lo[1], 2)} m, t ${fx(m.t, 3)}</div>
        <div>Mesh</div><div class="num">${m.elements.length} ${m.etype} · ${2 * m.nodes.length} DOFs</div><div>Theory</div><div>${theory}</div>${kind === "rc" ? `<div>Concrete</div><div>C${S.model.material.fck_MPa ?? 30}, ${S.model.material.values === "mean" ? "mean" : "design"} strengths</div>` : ""}`;
    }
    function index(t) {
      let lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
      for (const [a, b, c] of t.list) for (const p of [a, b, c]) { lo = [Math.min(lo[0], p[0]), Math.min(lo[1], p[1])]; hi = [Math.max(hi[0], p[0]), Math.max(hi[1], p[1])]; }
      const n = Math.max(1, Math.round(Math.sqrt(t.list.length / 4))), cw = Math.max((hi[0] - lo[0]) / n, 1e-12), ch = Math.max((hi[1] - lo[1]) / n, 1e-12);
      const cells = Array.from({ length: n * n }, () => []);
      const cl = (v) => Math.max(0, Math.min(n - 1, v));
      t.list.forEach((tr, k) => {
        const xs = [tr[0][0], tr[1][0], tr[2][0]], ys = [tr[0][1], tr[1][1], tr[2][1]];
        const i0 = cl(Math.floor((Math.min(...xs) - lo[0]) / cw)), i1 = cl(Math.floor((Math.max(...xs) - lo[0]) / cw));
        const j0 = cl(Math.floor((Math.min(...ys) - lo[1]) / ch)), j1 = cl(Math.floor((Math.max(...ys) - lo[1]) / ch));
        for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) cells[j * n + i].push(k);
      });
      t.grid = { lo, cw, ch, n, cells };
    }
    function hit(x, y) {
      if (!tris || !view || !tris.grid) return null;
      const [wx, wy] = toW(x, y), G = tris.grid;
      const i = Math.floor((wx - G.lo[0]) / G.cw), j = Math.floor((wy - G.lo[1]) / G.ch);
      if (i < 0 || j < 0 || i >= G.n || j >= G.n) return null;
      for (const k of G.cells[j * G.n + i]) {
        const [a, b, c, q] = tris.list[k];
        const d = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]);
        if (Math.abs(d) < 1e-30) continue;
        const l1 = ((b[1] - c[1]) * (wx - c[0]) + (c[0] - b[0]) * (wy - c[1])) / d, l2 = ((c[1] - a[1]) * (wx - c[0]) + (a[0] - c[0]) * (wy - c[1])) / d, l3 = 1 - l1 - l2;
        if (l1 >= -1e-9 && l2 >= -1e-9 && l3 >= -1e-9) return { q, v: l1 * a[2] + l2 * b[2] + l3 * c[2], wx, wy };
      }
      return null;
    }
    function bind() {
      const c = canvas(), pts = new Map();
      let last = null, down = null, pinch = null;
      c.addEventListener("pointerdown", (e) => { c.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); down = { x: e.clientX, y: e.clientY }; last = { x: e.clientX, y: e.clientY };
        if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); } $("#f-tip").hidden = true; });
      c.addEventListener("pointermove", (e) => {
        const rect = c.getBoundingClientRect();
        if (!pts.has(e.pointerId)) {
          if (e.pointerType !== "mouse") return;
          const h = hit(e.clientX - rect.left, e.clientY - rect.top), tip = $("#f-tip");
          if (!h) { tip.hidden = true; return; }
          const f = FIELDS[S.field];
          tip.innerHTML = `x ${fx(h.wx, 3)} · y ${fx(h.wy, 3)} m · element ${h.q + 1}${tris.band ? ` · ${f.label} <b>${fmt(h.v, 4)}</b> ${f.unit}` : ""}`;
          tip.hidden = false;
          tip.style.left = `${Math.max(4, Math.min(e.clientX - rect.left + 14, rect.width - tip.offsetWidth - 6))}px`; tip.style.top = `${Math.max(4, e.clientY - rect.top - 30)}px`;
          return;
        }
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2 && pinch) {
          const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2 - rect.left, cy = (a.y + b.y) / 2 - rect.top;
          zoomAt(cx, cy, d / pinch); pinch = d; return;
        }
        if (!view) return;
        view.ox += e.clientX - last.x; view.oy += e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; requestDraw();
      });
      const up = (e) => {
        if (!pts.has(e.pointerId)) return;
        pts.delete(e.pointerId);
        if (down && pts.size === 0 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5) {
          const rect = c.getBoundingClientRect(), h = hit(e.clientX - rect.left, e.clientY - rect.top);
          S.sel = h ? h.q : null; S.gsel = 0;
          if (h) S.frtab = "elem";
          renderResults(); draw();
        }
        if (pts.size < 2) pinch = null;
      };
      c.addEventListener("pointerup", up);
      c.addEventListener("pointercancel", (e) => pts.delete(e.pointerId));
      c.addEventListener("pointerleave", () => { $("#f-tip").hidden = true; });
      c.addEventListener("wheel", (e) => { e.preventDefault(); const rect = c.getBoundingClientRect(); zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015))); }, { passive: false });
      c.addEventListener("dblclick", fit);
      new ResizeObserver(resize).observe(box());
    }
    function zoomAt(x, y, f) { if (!view) return; view.ox = x - (x - view.ox) * f; view.oy = y - (y - view.oy) * f; view.s *= f; requestDraw(); }
    let drawPending = false;
    function requestDraw() { if (drawPending) return; drawPending = true; requestAnimationFrame(() => { drawPending = false; draw(); }); }
    return { rebuild, draw, fit, fitSoon, bind, theme: () => { readColors(); rebuild(); }, hit, toS: (p) => (view ? toS(p) : null), unlock: () => { lockedScale = null; } };
  })();

  // ------------------------------------------------------------ wiring
  function init() {
    const exFE = window.TRAGWERK_EXAMPLES_FE || {};
    const groups = { "Linear elasticity": ["wall", "cantilever", "kirsch"], "Reinforced concrete": ["deep", "rcwall", "panel"], "Nonlinear mechanics": ["hill", "elastica"], "Dynamics": ["quake"] };
    $("#f-preset").innerHTML = Object.entries(groups).map(([g, ks]) => `<optgroup label="${esc(g)}">${ks.map((k) => opt(k, PRESETS[k].label, "wall")).join("")}</optgroup>`).join("")
      + (Object.keys(exFE).length ? `<optgroup label="Open a model file">${Object.keys(exFE).map((k) => `<option value="ex:${esc(k)}">${esc(exFE[k].name || k)} (JSON)</option>`).join("")}</optgroup>` : "");
    $("#f-preset").onchange = (e) => { const k = e.target.value; cancelJobs(); S.nlRun = null; S.dyn.run = null; if (k.startsWith("ex:")) load("custom", exFE[k.slice(3)]); else load(k); };
    $$("[data-ftab]").forEach((t) => t.onclick = () => { S.ftab = t.dataset.ftab; renderEditor(); });
    $$("[data-frtab]").forEach((t) => t.onclick = () => {
      S.frtab = t.dataset.frtab;
      if (S.frtab === "des") setSource("des");
      else if (S.frtab === "nl" && S.nl) setSource("nl");
      else if (S.frtab === "dyn" && S.dyn.fe) setSource("dyn");
      else if (S.frtab === "res") setSource("lin");
      renderResults();
    });
    $$("[data-src]").forEach((b) => b.onclick = () => { if (b.disabled) return; S.scale = null; P.unlock(); setSource(b.dataset.src); S.frtab = { lin: S.frtab === "elem" ? "elem" : "res", des: "des", nl: "nl", dyn: "dyn" }[b.dataset.src]; renderResults(); });
    $$("[data-layer]").forEach((c) => c.onchange = () => { S.layers[c.dataset.layer] = c.checked; P.draw(); });
    $("#f-def").onchange = (e) => { S.def = e.target.checked; P.rebuild(); };
    $("#f-scale").oninput = (e) => { const v = Number(e.target.value); if (v >= 0 && isFinite(v)) { S.scale = v; P.unlock(); if (S.def) P.rebuild(); } };
    $("#f-mesh").onchange = (e) => { S.meshOn = e.target.checked; P.draw(); };
    $("#f-avg").onchange = (e) => { S.avg = e.target.checked; P.rebuild(); };
    $("#f-princ").onchange = (e) => { S.princ = e.target.checked; P.rebuild(); };
    $("#f-fit").onclick = () => P.fit();
    $("#f-step").oninput = (e) => { S.step = +e.target.value; stopPlay(); renderTimeline(); P.rebuild(true); if (S.frtab === "nl" || S.frtab === "dyn" || S.frtab === "elem") renderResultsThrottled(); };
    $("#f-step").onchange = () => { if (S.frtab === "nl" || S.frtab === "dyn" || S.frtab === "elem") renderResults(); };
    $("#f-play").onclick = togglePlay;
    $("#f-name").addEventListener("input", (e) => { S.model.name = e.target.value; P.rebuild(true); });
    $("#f-json").onclick = () => { $("#f-json-text").value = JSON.stringify(S.model, null, 2); $("#f-json-msg").textContent = ""; $("#f-drawer").hidden = false; };
    $("#f-drawer-close").onclick = () => { $("#f-drawer").hidden = true; };
    $("#f-json-copy").onclick = () => { const t = $("#f-json-text"); navigator.clipboard.writeText(t.value).then(() => { $("#f-json-msg").textContent = "Copied."; }, () => { t.select(); $("#f-json-msg").textContent = "Select all and copy with your keyboard."; }); };
    $("#f-json-load").onclick = () => {
      try { const d = JSON.parse($("#f-json-text").value); FE.parseFE(d); load("custom", d); $("#f-drawer").hidden = true; }
      catch (e) { $("#f-json-msg").textContent = `Not loaded: ${e.message}`; }
    };
    document.addEventListener("keydown", (e) => { if (ROOT.hidden) return; if (e.key === "Escape") { if (!$("#f-drawer").hidden) $("#f-drawer").hidden = true; else if (S.sel != null) { S.sel = null; renderResults(); P.draw(); } } });
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (mq && mq.addEventListener) mq.addEventListener("change", () => P.theme());
    new MutationObserver(() => P.theme()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    $("#f-ver").textContent = `v${T.VERSION}`;
    P.bind();
    $("#f-def").checked = S.def; $("#f-mesh").checked = S.meshOn; $("#f-avg").checked = S.avg;
    load("wall");
    window.TragwerkFE = { S, P, load, solve, runConvergence, runNonlinear, runMeshCheck, runDynamic, runSdof, makeRecord, setSource, computeDesign,
      render: () => { renderEditor(); renderResults(); renderChips(); P.rebuild(); } };
  }
  init();
})();
