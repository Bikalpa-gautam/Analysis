<style>
/* 3D studio: same drafting-room tokens as the 2D workspace. The structure is the
   hero; the checker's yellow highlighter marks what is selected. */
.mode { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--rule); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--sheet); flex: none; }
.modes button { border: 0; background: transparent; padding: 0 12px; height: 30px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.modes button[aria-selected="true"] { background: var(--ink); color: var(--sheet); }
.bench3 { grid-template-columns: minmax(300px, 340px) minmax(0, 1fr) minmax(330px, 410px); }
.bench3 .tabs .tab { padding: 6px 2px; font-size: 13.5px; }
.vtools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; }
.vtools select { height: 28px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); max-width: 250px; min-width: 0; }
.vtools label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 0 9px; height: 26px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }
.seg button:disabled { opacity: .45; cursor: default; }
.canvas3 { flex: 1; min-height: 340px; position: relative; overflow: hidden; background: var(--sheet); border-radius: 0 0 6px 6px; }
.canvas3 canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.canvas3[data-tool="node"] canvas, .canvas3[data-tool="member"] canvas { cursor: crosshair; }
.canvas3[data-tool="box"] canvas { cursor: cell; }
.canvas3[data-tool="support"] canvas, .canvas3[data-tool="load"] canvas, .canvas3[data-tool="delete"] canvas { cursor: pointer; }
.canvas3 svg.fallback { position: absolute; inset: 0; width: 100%; height: 100%; }
.views { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 2px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px; padding: 2px; z-index: 2; }
.views button { border: 0; background: transparent; padding: 3px 8px; font-size: 12px; cursor: pointer; border-radius: 3px; color: var(--ink-2); }
.views button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }
.views button:hover { color: var(--ink); }
.toolbar { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 2px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 3px; z-index: 3; }
.toolbar button { width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.toolbar button:hover { background: var(--paper); color: var(--ink); }
.toolbar button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.toolbar button:disabled { opacity: .35; cursor: default; }
.toolbar hr { border: 0; border-top: 1px solid var(--rule); margin: 2px 4px; }
.toolbar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.selbox { position: absolute; border: 1px dashed var(--ink); background: color-mix(in srgb, var(--mark) 18%, transparent); pointer-events: none; z-index: 4; }
.legend3 { position: absolute; left: 10px; top: 8px; max-width: min(460px, calc(100% - 70px)); font-size: 12px; color: var(--ink-2); pointer-events: none; background: color-mix(in srgb, var(--sheet) 84%, transparent); border-radius: 4px; padding: 4px 6px; z-index: 2; }
.legend3 b { color: var(--ink); font-weight: 600; }
.legend3 .toolhint { display: block; margin-top: 3px; color: var(--ink); }
.legend3 i.sw { display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: 0; margin: 0 4px 0 8px; }
.ramp { display: inline-block; width: 150px; height: 8px; border-radius: 4px; vertical-align: middle; margin: 0 6px; }
.ramp-ticks { position: relative; height: 13px; width: 150px; margin-left: 6px; font: 500 10.5px var(--font-num); color: var(--ink-3); }
.ramp-ticks span { position: absolute; top: 0; transform: translateX(-50%); }
.ramp-ticks span:first-child { transform: none; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 4; }
.busy { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 4px 12px; border-radius: 12px; font-size: 12px; z-index: 5; }
.canvas3 .titleblock { z-index: 2; right: 54px; }
.canvas3 .banner { z-index: 3; top: 44px; right: 54px; }
.fieldrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
.field input[type="checkbox"] { width: auto; height: auto; margin: 0; }
.checks { display: flex; gap: 12px; height: 28px; align-items: center; font-size: 13px; }
.checks label { display: inline-flex; gap: 5px; align-items: center; }
.field input[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-bg); }
.stepper { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; height: 28px; }
.stepper button { border: 0; background: var(--sheet); width: 28px; cursor: pointer; font-size: 15px; color: var(--ink-2); }
.stepper button + button { border-left: 1px solid var(--rule); }
.stepper button:hover { background: var(--paper); color: var(--ink); }
.secgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; }
.secgrid .lab { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-family: var(--font-num); font-size: 12px; }
.mini { width: 100%; height: auto; display: block; }
.mini text { font-family: var(--font-num); font-size: 10.5px; }
.edrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--rule-2); font-size: 12.5px; }
.edrow.inactive span { color: var(--ink-3); text-decoration: line-through; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions .btn { height: 30px; font-size: 13px; }
.btn.sm { height: 28px; padding: 0 8px; font-size: 12.5px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.inline-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }
.inline-form .btn { height: 28px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-items: end; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-items: end; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; align-items: end; }
details.fold { border: 1px solid var(--rule); border-radius: 5px; }
details.fold > summary { cursor: pointer; padding: 8px 10px; font: 600 14px var(--font-display); list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; color: var(--ink-3); font: 500 15px var(--font-num); }
details.fold[open] > summary::after { content: "−"; }
details.fold > summary .hint { font: 400 11.5px var(--font-body); }
details.fold > .fold-bd { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.subhd { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 4px 0 -2px; }
table.ed td input[readonly] { background: transparent; border-color: transparent; }
.tablewrap { max-height: 320px; overflow: auto; border: 1px solid var(--rule-2); border-radius: 4px; }
table.ed thead th { position: sticky; top: 0; background: var(--sheet); }
.crit { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 74px 64px; gap: 8px; align-items: center; padding: 6px 12px; border: 0; border-bottom: 1px solid var(--rule-2); background: transparent; cursor: pointer; text-align: left; font-size: 13px; }
.crit:hover { background: var(--paper); }
.crit.sel { background: color-mix(in srgb, var(--mark) 22%, transparent); }
.crit b { font: 600 13.5px var(--font-display); }
.crit .meta { display: block; font-size: 11.5px; color: var(--ink-3); }
.filters { display: flex; gap: 4px; padding: 8px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.mhead { padding: 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--rule); }
.mhead h2 { font-size: 18px; }
.mhead h2 mark { background: var(--mark); color: var(--mark-ink); padding: 0 5px; border-radius: 2px; }
.diag { padding: 8px 12px 4px; border-bottom: 1px solid var(--rule); display: grid; gap: 4px; }
.diag h3 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.diag h3 span { font: 400 11.5px var(--font-body); color: var(--ink-3); }
table.data tr.pick { cursor: pointer; }
table.data tr.pick:hover td { background: var(--paper); }
table.data tr.on td { background: color-mix(in srgb, var(--mark) 26%, transparent); }
.spec-svg { width: 100%; height: auto; display: block; }
.matx { overflow: auto; max-height: 280px; border: 1px solid var(--rule-2); border-radius: 4px; }
.matx table { border-collapse: collapse; font: 10.5px var(--font-num); }
.matx td, .matx th { padding: 2px 5px; text-align: right; white-space: nowrap; }
.matx thead th { color: var(--ink-3); font-weight: 500; position: sticky; top: 0; background: var(--sheet); }
.matx tbody th { color: var(--ink-3); font-weight: 500; position: sticky; left: 0; background: var(--sheet); }
.eq3 { font: 12.5px/1.6 var(--font-body); background: var(--paper); border-radius: 4px; padding: 8px 10px; overflow-x: auto; }
.eq3 div { white-space: nowrap; }
.spec-svg text { font: 10.5px var(--font-num); fill: var(--ink-3); }
@media (max-width: 1180px) { .bench3 { grid-template-columns: minmax(290px, 330px) minmax(0, 1fr); } }
@media (max-width: 760px) {
  .canvas3 { flex: none; height: 58vh; min-height: 360px; }
  .modes button { padding: 0 9px; }
  .legend3 { max-width: calc(100% - 64px); }
}
</style>

  const LIST_RANGE = { spans_x: [1, 40], spans_y: [1, 40], storeys: [1, 40], spans: [5, 200], pier_heights: [1, 100], ts_stations: [0, 1] };

  const BUCK0 = () => ({ on: true, modes: 4, segments: 4 });

  const S = {

    newCase: { id: "", name: "", type: "variable", category: "B", group: "" }, tables: "", dyn: DYN0(), seis: SEIS0(), buck: BUCK0(), buckRes: null, buckErr: null,

  // ================================================================ run
  let timer = null;

  function runNow() {
    clearTimeout(timer);
    try {
      S.data = buildModel();

    if (S.data) {
      try {
        if (S.data.nodes.length > MAX_NODES) throw new Error(`${S.data.nodes.length} nodes: the browser studio handles up to ${MAX_NODES}. Use the Python package or the API for larger models.`);
        if (S.data.nodes.length < 2 || !S.data.members.length) throw new Error("Start drawing: pick the member tool (right of the 3D view) and click two points of the grid. Add supports with the support tool.");
        S.result = T.runProject3d(S.data, { sectionCache, maxCombinations: MAX_ULS });

  // Linear buckling runs after the main analysis, one ULS combination at a time in ~30 ms slices, so the studio stays

      let job;

    $$("#b-tools [data-act=undo]").forEach((b) => b.onclick = undo);
    $$("#b-tools [data-act=redo]").forEach((b) => b.onclick = redo);
    $("#b-slabs").checked = S.slabs;
    $("#b-slabs").onchange = (e) => { S.slabs = e.target.checked; saveView(); V.rebuild(); };
    $("#b-animate").onchange = (e) => { S.animate = e.target.checked; V.setAnimate(); };
    $("#b-source").onchange = (e) => { S.source = e.target.value; V.refreshOverlay(); if (S.rtab === "modes") renderResults(); };
    $("#b-level").onchange = (e) => { S.level = e.target.value; V.rebuild(); V.refreshOverlay(); };
    $("#b-name").addEventListener("input", (e) => { if (S.spec) S.spec.name = e.target.value; else S.base.name = e.target.value; if (S.data) S.data.name = e.target.value; V.rebuild(); });
    $("#b-json").onclick = () => { $("#b-json-text").value = JSON.stringify(S.data, null, 2); $("#b-json-msg").textContent = ""; $("#b-drawer").hidden = false; $("#b-json-text").focus(); };
    $("#b-drawer-close").onclick = () => { $("#b-drawer").hidden = true; };
    $("#b-drawer").addEventListener("click", (e) => { if (e.target.id === "b-drawer") $("#b-drawer").hidden = true; });
    document.addEventListener("keydown", (e) => {
      if (ROOT.hidden) return;
      if (e.key === "Escape") {
        if (!$("#b-drawer").hidden) { $("#b-drawer").hidden = true; return; }
        if (S.draw) { V.cancelDraw(); return; }
        if (S.tool !== "select") { setTool("select"); return; }
        select(null, false, true);
        return;
      }
      const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
      if (typing) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
      if ((e.key === "Delete" || e.key === "Backspace") && (S.selM.size || S.selN.size)) { e.preventDefault(); deleteSelection(); }
    });
    $("#b-json-copy").onclick = () => {
      const t = $("#b-json-text");
      navigator.clipboard.writeText(t.value).then(() => { $("#b-json-msg").textContent = "Copied."; }, () => { t.select(); $("#b-json-msg").textContent = "Select all and copy with your keyboard."; });
    };
    $("#b-json-load").onclick = () => {
      try {
        const data = JSON.parse($("#b-json-text").value);
        if (data.schema !== T.SCHEMA3D) throw new Error(`expected schema '${T.SCHEMA3D}'; 2D models open in the 2D frame workspace`);
        T.parseModel3d(data);
        loadData(data); $("#b-drawer").hidden = true; toast("Model loaded.");
      } catch (e) { $("#b-json-msg").textContent = `Not loaded: ${e.message}`; }
    };
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (mq && mq.addEventListener) mq.addEventListener("change", () => V.theme());
    new MutationObserver(() => V.theme()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    $$("[data-show]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.show === S.show)));
    $$("[data-tool]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tool === S.tool)));
    syncLookControls();
    $("#b-ver").textContent = `v${T.VERSION}`;
    V.init();
    $("#b-preset").value = "office";
    S.spec = Object.assign(T.BUILDING_DEFAULTS(), clone(PRESETS.office.spec));
    renderEditor();
    afterEdit();
    $("#b-busy").hidden = false;
    setTimeout(() => { runNow(); syncLookControls(); V.setCamera("iso", true); }, 30);
    window.TragwerkStudio3D = { S, V, runNow, select, selectNode, setTool, setShow, addEdit, undo, redo, load, startBlank };
  }
  init();
})();
</script>

<script>
(function () {
  "use strict";
  const modes = { "3d": document.getElementById("mode-3d"), "2d": document.getElementById("mode-2d"), fe: document.getElementById("mode-fe") };
  function setMode(m) {
    if (!modes[m]) m = "3d";
    for (const [k, el] of Object.entries(modes)) el.hidden = k !== m;
    document.querySelectorAll(".modes [data-mode]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
    try { localStorage.setItem("tragwerk.mode", m); } catch (e) { /* storage unavailable */ }
    window.dispatchEvent(new Event("resize"));
  }
  document.querySelectorAll(".modes [data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  let m = "3d";
  try { m = localStorage.getItem("tragwerk.mode") || "3d"; } catch (e) { /* storage unavailable */ }
  setMode(m);
})();
</script>
