<style>
/* 3D studio: same drafting-room tokens as the 2D workspace. The building is the
   hero; the checker's yellow highlighter marks the member under inspection. */
.mode { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--sheet); flex: none; }
.modes button { border: 0; background: transparent; padding: 0 12px; height: 30px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.modes button[aria-selected="true"] { background: var(--ink); color: var(--sheet); }
.bench3 { grid-template-columns: minmax(290px, 330px) minmax(0, 1fr) minmax(330px, 410px); }
.vtools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; }
.vtools select { height: 28px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); max-width: 230px; min-width: 0; }
.vtools label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 0 9px; height: 26px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }
.seg button:disabled { opacity: .45; cursor: default; }
.canvas3 { flex: 1; min-height: 340px; position: relative; overflow: hidden; background: var(--sheet); border-radius: 0 0 6px 6px; }
.canvas3 canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.canvas3 canvas:active { cursor: grabbing; }
.canvas3 svg.fallback { position: absolute; inset: 0; width: 100%; height: 100%; }
.views { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 2px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px; padding: 2px; z-index: 2; }
.views button { border: 0; background: transparent; padding: 3px 8px; font-size: 12px; cursor: pointer; border-radius: 3px; color: var(--ink-2); }
.views button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }
.views button:hover { color: var(--ink); }
.legend3 { position: absolute; left: 10px; top: 8px; max-width: min(430px, calc(100% - 20px)); font-size: 12px; color: var(--ink-2); pointer-events: none; background: color-mix(in srgb, var(--sheet) 82%, transparent); border-radius: 4px; padding: 4px 6px; z-index: 2; }
.legend3 b { color: var(--ink); font-weight: 600; }
.legend3 i.sw { display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: 0; margin: 0 4px 0 8px; }
.ramp { display: inline-block; width: 150px; height: 8px; border-radius: 4px; vertical-align: middle; margin: 0 6px; }
.ramp-ticks { position: relative; height: 13px; width: 150px; margin-left: 6px; font: 500 10.5px var(--font-num); color: var(--ink-3); }
.ramp-ticks span { position: absolute; top: 0; transform: translateX(-50%); }
.ramp-ticks span:first-child { transform: none; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 4; }
.busy { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 4px 12px; border-radius: 12px; font-size: 12px; z-index: 5; }
.canvas3 .titleblock { z-index: 2; }
.canvas3 .banner { z-index: 3; top: 44px; }
.fieldrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
.field input[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-bg); }
.stepper { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; height: 28px; }
.stepper button { border: 0; background: var(--sheet); width: 28px; cursor: pointer; font-size: 15px; color: var(--ink-2); }
.stepper button + button { border-left: 1px solid var(--rule); }
.stepper button:hover { background: var(--paper); color: var(--ink); }
.secgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; }
.secgrid .lab { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-family: var(--font-num); font-size: 12px; }
.mini { width: 100%; height: auto; display: block; }
.mini text { font-family: var(--font-num); font-size: 10.5px; }
.edrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule-2); font-size: 13px; }
.edrow.inactive span { color: var(--ink-3); text-decoration: line-through; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions .btn { height: 30px; font-size: 13px; }
.inline-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; align-items: end; }
.inline-form .btn { height: 28px; }
.crit { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 74px 64px; gap: 8px; align-items: center; padding: 6px 12px; border: 0; border-bottom: 1px solid var(--rule-2); background: transparent; cursor: pointer; text-align: left; font-size: 13px; }
.crit:hover { background: var(--paper); }
.crit.sel { background: color-mix(in srgb, var(--mark) 22%, transparent); }
.crit b { font: 600 13.5px var(--font-display); }
.crit .meta { display: block; font-size: 11.5px; color: var(--ink-3); }
.filters { display: flex; gap: 4px; padding: 8px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.mhead { padding: 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--rule); }
.mhead h2 { font-size: 18px; }
.mhead h2 mark { background: var(--mark); color: var(--mark-ink); padding: 0 5px; border-radius: 2px; }
.diag { padding: 8px 12px 4px; border-bottom: 1px solid var(--rule); display: grid; gap: 4px; }
.diag h3 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.diag h3 span { font: 400 11.5px var(--font-body); color: var(--ink-3); }
@media (max-width: 1180px) { .bench3 { grid-template-columns: minmax(280px, 320px) minmax(0, 1fr); } }
@media (max-width: 760px) {
  .canvas3 { flex: none; height: 56vh; min-height: 340px; }
  .modes button { padding: 0 9px; }
  .legend3 { max-width: calc(100% - 20px); }
}
</style>

<div id="mode-3d" class="mode">
<header class="bar">
  <div class="brand"><b>Tragwerk</b><span id="b-ver">v0.2</span></div>
  <div class="modes" role="tablist" aria-label="Workspace"><button role="tab" data-mode="3d" aria-selected="true">3D building</button><button role="tab" data-mode="2d" aria-selected="false">2D frame</button></div>
  <input id="b-name" class="model-name" aria-label="Model name" value="">
  <select id="b-preset" aria-label="Start from"></select>
  <button id="b-json" class="btn">Model JSON</button>
  <div class="verdict" id="b-verdict" aria-live="polite"></div>
</header>

<main class="bench bench3">
  <section class="pane editor" aria-label="Build the model">
    <div class="pane-hd">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-btab="grid" aria-selected="true">Grid</button>
        <button class="tab" role="tab" data-btab="sections" aria-selected="false">Sections</button>
        <button class="tab" role="tab" data-btab="loads" aria-selected="false">Loads</button>
        <button class="tab" role="tab" data-btab="edits" aria-selected="false">Edits</button>
      </div>
    </div>
    <div class="pane-bd" id="b-editor"></div>
  </section>

  <section class="pane draw" aria-label="3D model">
    <div class="pane-hd">
      <div class="chips" role="group" aria-label="What to show" id="b-show">
        <button class="chip" data-show="model">Model</button>
        <button class="chip" data-show="My">M<sub>y</sub></button>
        <button class="chip" data-show="Mz">M<sub>z</sub></button>
        <button class="chip" data-show="N">N</button>
        <button class="chip" data-show="def">Deformed</button>
        <button class="chip" data-show="util">Utilisation</button>
      </div>
      <div class="vtools">
        <select id="b-source" aria-label="Results to show"></select>
        <select id="b-level" aria-label="Levels to show"></select>
        <span class="seg" role="group" aria-label="Member display"><button data-look="solid">Solid</button><button data-look="lines">Lines</button></span>
        <label><input type="checkbox" id="b-slabs" checked> Slabs</label>
      </div>
    </div>
    <div class="canvas3" id="b-canvas">
      <div class="legend3" id="b-legend"></div>
      <div class="views" role="group" aria-label="Camera">
        <button data-cam="iso">3D</button><button data-cam="plan">Plan</button><button data-cam="xz">X–Z</button><button data-cam="yz">Y–Z</button><button data-cam="fit" title="Fit the model in view">Fit</button>
      </div>
      <div class="titleblock" id="b-title"></div>
      <div class="tip" id="b-tip" hidden></div>
      <div class="banner" id="b-banner" hidden></div>
      <div class="busy" id="b-busy" hidden>Analysing…</div>
    </div>
  </section>

  <section class="pane results" aria-label="Results">
    <div id="b-summary"></div>
    <div class="rtabs" role="tablist">
      <button class="tab" role="tab" data-rtab="member" aria-selected="true">Member</button>
      <button class="tab" role="tab" data-rtab="critical" aria-selected="false">Critical</button>
      <button class="tab" role="tab" data-rtab="reactions" aria-selected="false">Reactions</button>
      <button class="tab" role="tab" data-rtab="combos" aria-selected="false">Combinations</button>
    </div>
    <div class="pane-bd" id="b-results"></div>

</main>

<div class="drawer" id="b-drawer" hidden>

    <div class="row"><button class="btn primary" id="b-json-copy">Copy</button><button class="btn" id="b-json-load">Load pasted model</button><span class="hint" id="b-json-msg"></span></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const T = window.Tragwerk;
  const ROOT = document.getElementById("mode-3d");
  const $ = (s, el = ROOT) => el.querySelector(s);
  const $$ = (s, el = ROOT) => Array.from(el.querySelectorAll(s));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mk = (s) => esc(s).replace(/_\{([^}]*)\}/g, "<sub>$1</sub>").replace(/\^\{([^}]*)\}/g, "<sup>$1</sup>");
  const STATUS = { pass: "Pass", fail: "Fail", not_covered: "Not covered", info: "Info", warn: "Warning" };
  const pill = (s) => `<span class="pill ${s}">${STATUS[s] || s}</span>`;
  const f3 = (v) => (v == null || !isFinite(v) ? "–" : T.fmt(v));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const r1 = (v) => (Math.round(v * 10) / 10).toFixed(1);
  const CONCRETE = { 20: "C20/25", 25: "C25/30", 30: "C30/37", 35: "C35/45", 40: "C40/50", 45: "C45/55", 50: "C50/60", 55: "C55/67", 60: "C60/75" };
  const CAT_NAMES = { A: "A, residential", B: "B, office", C: "C, assembly", D: "D, shopping", E: "E, storage", F: "F, vehicles ≤ 30 kN", G: "G, vehicles ≤ 160 kN" };
  const QLABEL = { My: "M<sub>y</sub>", Mz: "M<sub>z</sub>", N: "N", Vz: "V<sub>z</sub>", Vy: "V<sub>y</sub>", T: "T" };
  const QUNIT = { My: "kNm", Mz: "kNm", N: "kN", Vz: "kN", Vy: "kN", T: "kNm" };
  const MAX_NODES = 2500, MAX_ULS = 1500;
  const sec0 = (b, h, top, bottom, side, links, cover) => {
    const s = { type: "rc_rect", b_mm: b, h_mm: h, concrete: "concrete", rebar: "B500B", cover_mm: cover, top: { n: top[0], dia_mm: top[1] }, bottom: { n: bottom[0], dia_mm: bottom[1] },
      links: { dia_mm: links[0], legs: links[1], spacing_mm: links[2] } };
    if (side) s.side = { n: side[0], dia_mm: side[1] };
    return s;
  };
  const PRESETS = {
    office: { label: "Office, 3 × 2 bays, 4 storeys", spec: {} },
    tower: { label: "Residential tower, 10 storeys", spec: { name: "Residential tower, 2 × 2 bays, 10 storeys", spans_x: [5.4, 5.4], spans_y: [5.0, 5.0],
      storeys: [3.2, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0], imposed: 2.0, imposed_category: "A", wind: 1.1, facade: 7.0, fck: 35,
      column: sec0(500, 500, [4, 25], [4, 25], [2, 25], [10, 2, 250], 35), beam_x: sec0(300, 500, [4, 20], [3, 20], null, [8, 2, 200], 30),
      beam_y: sec0(300, 500, [4, 20], [3, 20], null, [8, 2, 200], 30) } },
    carpark: { label: "Car park, 3 × 2 bays, 8 m spans", spec: { name: "Car park, 3 × 2 bays, 3 decks", spans_x: [8.0, 8.0, 8.0], spans_y: [7.5, 7.5],
      storeys: [3.0, 2.8, 2.8], imposed: 2.5, imposed_category: "F", finishes: 0.5, facade: 3.0, snow: 1.2, slab_mm: 250, wind: 0.7,
      column: sec0(450, 450, [4, 25], [4, 25], [1, 25], [10, 2, 250], 35), beam_x: sec0(400, 750, [5, 25], [4, 25], null, [10, 2, 250], 35),
      beam_y: sec0(400, 700, [5, 25], [4, 25], null, [10, 2, 250], 35) } },
  };

  const S = {
    spec: null, base: null, extraSections: {}, edits: [], data: null, result: null, error: null,
    btab: "grid", rtab: "member", show: "util", source: "env", level: "all", look: "solid", slabs: true,
    sel: null, hover: null, openCheck: null, critFilter: "all", formLoad: { w: 5, caseId: null, dir: "global_z" }, defInfo: null,
  };
  try {
    const st = JSON.parse(localStorage.getItem("tragwerk3d.view") || "{}");
    if (st.show) S.show = st.show; if (st.look) S.look = st.look; if (typeof st.slabs === "boolean") S.slabs = st.slabs;
  } catch (e) { /* storage unavailable */ }
  const saveView = () => { try { localStorage.setItem("tragwerk3d.view", JSON.stringify({ show: S.show, look: S.look, slabs: S.slabs })); } catch (e) { /* storage unavailable */ } };
  const sectionCache = new Map();

  // ================================================================ model building
  function concreteName(d) { const e = Object.entries(d.materials || {}).find(([, m]) => m.type === "concrete"); return e ? e[0] : null; }
  function buildModel() {
    const d = S.spec ? T.generateBuilding(S.spec) : clone(S.base);
    const cn = concreteName(d);
    for (const [name, def] of Object.entries(S.extraSections)) d.sections[name] = Object.assign(clone(def), cn ? { concrete: cn } : {});
    for (const e of S.edits) e.active = applyEdit(d, e);
    return d;
  }
  function applyEdit(d, e) {
    const m = d.members.find((x) => x.id === e.member);
    if (!m) return false;
    if (e.op === "remove") {
      d.members = d.members.filter((x) => x !== m);
      for (const lc of d.load_cases) lc.loads = (lc.loads || []).filter((l) => l.member !== m.id);
      const used = new Set();
      for (const x of d.members) { used.add(x.i); used.add(x.j); }
      const gone = new Set(d.nodes.filter((n) => !used.has(n.id)).map((n) => n.id));
      if (gone.size) {
        d.nodes = d.nodes.filter((n) => !gone.has(n.id));
        d.supports = (d.supports || []).filter((s) => !gone.has(s.node));
        for (const lc of d.load_cases) lc.loads = lc.loads.filter((l) => !(l.node && gone.has(l.node)));
      }
      return true;
    }
    if (e.op === "section") { if (!(e.section in d.sections)) return false; m.section = e.section; return true; }
    if (e.op === "release") { m.releases = { i: true, j: true }; return true; }
    if (e.op === "load") {
      const lc = d.load_cases.find((c) => c.id === e.caseId);
      if (!lc) return false;
      lc.loads = (lc.loads || []).concat([{ type: "udl", member: m.id, w: e.w, direction: e.dir }]);
      return true;
    }
    return false;
  }
  function editLabel(e) {
    if (e.op === "remove") return `Removed ${e.member}`;
    if (e.op === "section") return `${e.member}: section ${e.section}`;
    if (e.op === "release") return `${e.member}: pinned at both ends`;
    if (e.op === "load") return `${e.member}: ${f3(e.w)} kN/m ${e.dir.replace("global_", "along ").replace("local_", "local ")} in ${e.caseId}`;
    return e.op;
  }

  // ================================================================ run
  let timer = null;
  function schedule(delay = 320) {
    clearTimeout(timer);
    $("#b-busy").hidden = false;
    timer = setTimeout(runNow, delay);
  }
  function runNow() {
    clearTimeout(timer);
    try {
      S.data = buildModel();
      if (S.data.nodes.length > MAX_NODES) throw new Error(`${S.data.nodes.length} nodes: the browser studio handles up to ${MAX_NODES}. Use the Python package or the API for larger models.`);
      S.result = T.runProject3d(S.data, { sectionCache, maxCombinations: MAX_ULS });
      S.error = null;
    } catch (e) { S.error = e.message; S.result = null; }
    if (S.sel && !(S.data && S.data.members.some((m) => m.id === S.sel))) { S.sel = null; S.openCheck = null; }
    $("#b-busy").hidden = true;
    renderHeader(); renderSource(); renderLevels(); renderEditorHints(); renderResults();
    V.rebuild(); V.refreshOverlay();
  }
  function load(opts) {
    S.spec = opts.spec ? Object.assign(T.BUILDING_DEFAULTS(), clone(opts.spec)) : null;
    S.base = opts.base ? clone(opts.base) : null;
    S.extraSections = {}; S.edits = []; S.sel = null; S.openCheck = null; S.source = "env"; S.level = "all";
    renderEditor();
    runNow();
    V.setCamera("iso", true);
  }
  function loadData(data) {
    const meta = data.meta || {};
    if (meta.generator === "tragwerk.building" && meta.spec) {
      try { if (JSON.stringify(T.generateBuilding(meta.spec)) === JSON.stringify(data)) return load({ spec: meta.spec }); } catch (e) { /* fall through to a free-form model */ }
    }
    load({ base: data });
  }

  // ================================================================ header
  function renderHeader() {
    const name = $("#b-name");
    if (document.activeElement !== name) name.value = (S.data && S.data.name) || "";
    const v = $("#b-verdict"), r = S.result;
    if (!r) { v.innerHTML = `<span class="lbl">${S.error ? "Cannot analyse" : "…"}</span>`; return; }
    const s = r.summary;
    v.innerHTML = `<span class="eta" style="color:${s.status === "fail" ? "var(--bad)" : s.status === "pass" ? "var(--ok)" : "var(--nc)"}">${s.max_utilisation != null ? s.max_utilisation.toFixed(2) : "–"}</span>
      <span class="lbl">max η<br>${s.governing ? esc(s.governing.member) : ""}</span>${pill(s.status)}`;
  }

  // ================================================================ editor
  const listText = (a) => a.map((v) => +(+v).toFixed(3)).join(", ");
  function parseList(text) {
    const parts = String(text).split(/[,;\s]+/).filter(Boolean);
    if (!parts.length || parts.length > 40) return null;
    const vals = parts.map(Number);
    return vals.every((v) => isFinite(v) && v >= 1 && v <= 40) ? vals : null;
  }
  function renderEditor() {
    $$("[data-btab]").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.btab === S.btab)));
    const ed = $("#b-editor");
    const custom = !S.spec;
    if (S.btab === "grid") {
      if (custom) {
        ed.innerHTML = `<div class="tabpanel"><div class="group"><h3>Free-form model</h3><p class="hint">This model was loaded from JSON, so the building generator is off. Inspect and edit members in the 3D view, change sections in the Sections tab, or start a generated building.</p>
          <div class="actions"><button class="btn" id="b-new">New generated building</button></div></div><div class="group" id="b-stats"></div></div>`;
        $("#b-new").onclick = () => { $("#b-preset").value = "office"; load({ spec: PRESETS.office.spec }); };
      } else {
        const sp = S.spec;
        ed.innerHTML = `<div class="tabpanel">
          <div class="group"><div class="group-hd"><h3>Grid</h3><span class="hint">axes A, B, C … along X; 1, 2 … along Y</span></div>
            <div class="fieldrow"><label class="field">Spans along X (m)<input data-list="spans_x" value="${listText(sp.spans_x)}" inputmode="decimal"></label><span class="stepper"><button data-step="spans_x:-1" aria-label="Remove a bay along X">−</button><button data-step="spans_x:1" aria-label="Add a bay along X">+</button></span></div>

  // ================================================================ results helpers
  function memberUtil(mid) {
    const lst = (S.result && S.result.checks[mid]) || [];
    let u = null, st = "pass";
    for (const c of lst) {
      if (c.status === "fail") st = "fail"; else if (c.status === "not_covered" && st !== "fail") st = "not_covered";
      if (c.utilisation != null && (c.status === "pass" || c.status === "fail")) u = Math.max(u ?? 0, isFinite(c.utilisation) ? c.utilisation : 9.99);

    if (st === "fail" && u == null) u = 9.99;

  }
  function sourceFactors(src) {
    const r = S.result;
    if (!r || src === "env") return null;
    if (src.startsWith("case:")) { const id = src.slice(5); return r.combos.caseIds.map((c) => (c === id ? 1 : 0)); }
    const c = r.combos.combos.find((x) => x.id === src.slice(6));
    return c ? c.factors : null;
  }
  function sourceLabel(src) {
    const r = S.result;
    if (src === "env") return "ULS envelope";
    if (src.startsWith("case:")) { const lc = r.model.load_cases[src.slice(5)]; return lc ? `${lc.id}, ${lc.name}` : src; }
    const c = r.combos.combos.find((x) => x.id === src.slice(6));
    return c ? `${c.id}: ${c.label}` : src;
  }
  function series(mid, q, fac) {
    const r = S.result, ids = r.combos.caseIds;
    const rows = ids.map((c) => r.cases[c].members[mid][q]);
    return rows[0].map((_, j) => fac.reduce((s, f, k) => s + f * rows[k][j], 0));
  }
  function deformFactors() {
    const f = sourceFactors(S.source);
    if (f) { S.defInfo = sourceLabel(S.source); return f; }
    const r = S.result, ids = r.combos.caseIds, chars = r.combos.combos.filter((c) => c.kind === "SLS_char");
    let best = chars[0], bv = -1;
    for (const c of chars) {
      let v = 0;
      r.analysis.nodeIds.forEach((_, k) => {
        let ux = 0, uy = 0, uz = 0;
        c.factors.forEach((fv, q) => { const d = r.cases[ids[q]].displacements[k]; ux += fv * d[0]; uy += fv * d[1]; uz += fv * d[2]; });
        v = Math.max(v, Math.hypot(ux, uy, uz));
      });
      if (v > bv) { bv = v; best = c; }
    }
    S.defInfo = `${best.id}, the characteristic combination that moves the most`;
    return best.factors;
  }

    function drawDeformed(r, g) {
      const fac = deformFactors(), ids = r.combos.caseIds;
      let dmax = 0, at = null;
      r.analysis.nodeIds.forEach((nid, k) => {
        let ux = 0, uy = 0, uz = 0;
        fac.forEach((f, q) => { const d = r.cases[ids[q]].displacements[k]; ux += f * d[0]; uy += f * d[1]; uz += f * d[2]; });
        const u = Math.hypot(ux, uy, uz); if (u > dmax) { dmax = u; at = nid; }
      });
      const data = g.map((m) => {
        const md = r.analysis.members[m.id], x = r.analysis.stations[m.id].x;
        const u = series(m.id, "u", fac), vv = series(m.id, "v", fac), w = series(m.id, "w", fac);
        return { m, md, x, u, vv, w };
      });
      for (const dd of data) for (let k = 0; k < dd.x.length; k++) dmax = Math.max(dmax, Math.hypot(dd.u[k], dd.vv[k], dd.w[k]));
      v.defMax = dmax; v.defAt = at;
      if (dmax < 1e-12) return;
      const sc = Math.max(ctl.size * 0.06, 0.5) / dmax;
      v.defScale = sc;
      const pts = [];
      for (const { m, md, x, u, vv, w } of data) {
        const lam = md.lam;
        const P = (k) => {
          const gx = lam[0][0] * u[k] + lam[1][0] * vv[k] + lam[2][0] * w[k], gy = lam[0][1] * u[k] + lam[1][1] * vv[k] + lam[2][1] * w[k], gz = lam[0][2] * u[k] + lam[1][2] * vv[k] + lam[2][2] * w[k];
          return [m.a[0] + m.ex[0] * x[k] + gx * sc, m.a[1] + m.ex[1] * x[k] + gy * sc, m.a[2] + m.ex[2] * x[k] + gz * sc];
        };
        for (let k = 0; k + 1 < x.length; k++) if (x[k + 1] - x[k] > 1e-9) pts.push(...P(k), ...P(k + 1));
      }
      const nseg = pts.length / 6, t = Math.max(ctl.size * 0.0032, 0.045);
      const tubes = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: colors.def }), nseg);
      const mt = new THREE.Matrix4(), a = new THREE.Vector3(), b = new THREE.Vector3(), dv = new THREE.Vector3(), up = new THREE.Vector3(), side = new THREE.Vector3();
      for (let k = 0; k < nseg; k++) {
        a.fromArray(pts, 6 * k); b.fromArray(pts, 6 * k + 3); dv.subVectors(b, a);
        const len = dv.length() || 1e-6;
        up.set(0, 0, 1); if (Math.abs(dv.z) > 0.9 * len) up.set(1, 0, 0);
        side.crossVectors(up, dv).normalize().multiplyScalar(t); up.crossVectors(dv, side).normalize().multiplyScalar(t);
        mt.makeBasis(dv.clone().multiplyScalar(1 + t / len), side, up); mt.setPosition(a.clone().add(b).multiplyScalar(0.5));
        tubes.setMatrixAt(k, mt);
      }
      tubes.instanceMatrix.needsUpdate = true; tubes.renderOrder = 4;
      gOverlay.add(tubes);
    }

    // ---------------------------------------------------------- legend and title block
    function renderLegend() {
      const el = $("#b-legend"), r = S.result;
      const banner = $("#b-banner");
      if (S.error) { banner.hidden = false; banner.textContent = S.error; } else banner.hidden = true;
      if (!v.ok && v.reason) { el.innerHTML = `<b>${esc(v.reason)}.</b> Showing a plain drawing; results and checks are complete.`; return; }
      if (S.show === "model" || !r) {
        el.innerHTML = `Drag to orbit · right-drag or shift-drag to pan · scroll or pinch to zoom · click a member to inspect it.${hangs() && look() === "solid" ? "<br>Beams are drawn hanging below the floor level; the analysis uses centre lines." : ""}`;
      } else if (S.show === "util") {
        el.innerHTML = `<b>Utilisation η</b>, largest over all checks of each member<br><span class="ramp" style="background:${v.rampCss()}"></span><span class="num">> 1 fails</span><div class="ramp-ticks"><span style="left:0">0</span><span style="left:50%">0.5</span><span style="left:80%">0.8</span><span style="left:100%">1.0</span></div>`;
      } else if (S.show === "def") {
        el.innerHTML = `<b>Deformed shape</b>, ${esc(S.defInfo || "")}<br>max <b class="num">${v.defMax != null ? (v.defMax * 1000).toFixed(1) : "–"} mm</b>${v.defAt ? ` at node ${esc(v.defAt)}` : ""}, drawn ×${v.defScale ? Math.round(v.defScale) : "–"}`;
      } else {
        const q = S.show, plane = q === "Mz" ? "x-y plane, on the tension side" : q === "My" ? "x-z plane, on the tension side" : "+ tension";
        el.innerHTML = `<b>${QLABEL[q]}</b> ${plane}, ${esc(sourceLabel(S.source))}<br><i class="sw" style="background:var(--plot-pos)"></i>positive<i class="sw" style="background:var(--plot-neg)"></i>negative · largest <b class="num">${v.diagMax != null ? T.fmt(v.diagMax) : "–"} ${QUNIT[q]}</b>`;
      }
    }
    function renderTitle() {
      const d = S.data, el = $("#b-title");
      if (!d) { el.innerHTML = ""; return; }
      const xs = d.nodes.map((n) => n.x), ys = d.nodes.map((n) => n.y), zs = d.nodes.map((n) => n.z ?? 0);
      const span = (a) => (a.length ? Math.max(...a) - Math.min(...a) : 0);
      el.innerHTML = `<div class="tb-name">${esc(d.name || "Untitled")}</div><div>Size</div><div class="num">${r1(span(xs))} × ${r1(span(ys))} × ${r1(span(zs))} m</div>
        <div>Model</div><div class="num">${d.nodes.length} nodes · ${d.members.length} members</div><div>Code</div><div>EN 1990, EN 1992-1-1</div>`;
    }

    // ---------------------------------------------------------- fallback (no WebGL): axonometric SVG
    function drawFallback() {
      const c = container();
      let svg = c.querySelector("svg.fallback");
      if (!svg) { svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "fallback"); c.prepend(svg); }
      const g = (v.geom || []).filter((m) => m.zmax <= zCut() + 1e-6);
      const W = c.clientWidth || 600, H = c.clientHeight || 400;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      if (!g.length) { svg.innerHTML = ""; return; }
      const az = -35 * DEG, el = 28 * DEG;
      const P = (p) => [p[0] * Math.cos(az) - p[1] * Math.sin(az), (p[0] * Math.sin(az) + p[1] * Math.cos(az)) * Math.sin(el) + p[2] * Math.cos(el)];
      const pts = g.flatMap((m) => [P(m.a), P(m.b)]);
      const x0 = Math.min(...pts.map((p) => p[0])), x1 = Math.max(...pts.map((p) => p[0])), y0 = Math.min(...pts.map((p) => p[1])), y1 = Math.max(...pts.map((p) => p[1]));
      const s = Math.min((W - 80) / Math.max(x1 - x0, 1e-6), (H - 120) / Math.max(y1 - y0, 1e-6));
      const X = (p) => 40 + (p[0] - x0) * s, Y = (p) => H - 60 - (p[1] - y0) * s;
      svg.innerHTML = g.map((m) => {
        const a = P(m.a), b = P(m.b), { u, st } = memberUtil(m.id);
        const col = S.show === "util" && u != null ? (st === "fail" || u > 1 ? "var(--bad)" : u > 0.8 ? "var(--nc)" : "var(--ok)") : "var(--ink-2)";
        const sel = m.id === S.sel;
        return `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="${sel ? "var(--mark)" : col}" stroke-width="${sel ? 6 : 2}" data-fb="${esc(m.id)}" style="cursor:pointer"/>`;
      }).join("");
      svg.querySelectorAll("[data-fb]").forEach((l) => l.addEventListener("click", () => select(l.dataset.fb, true)));
    }

    v.init = function () { init(); if (!v.ok) { v.fallback = true; new ResizeObserver(() => drawFallback()).observe(container()); } };
    v.setCamera = function (k, reset) { if (v.ok) setCamera(k, reset); };
    v.fitTo = fitTo;
    v.theme = function () { readColors(); v.rebuild(); v.refreshOverlay(); };
    return v;
  })();

  // ================================================================ misc UI
  let toastTimer = null;
  function toast(msg) {
    let el = document.querySelector(".toast");
    if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
  }
  function setShow(s) {
    S.show = s; saveView();
    $$("[data-show]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.show === S.show)));
    syncLookControls(); renderSource(); V.rebuild(); V.refreshOverlay();
  }
  function syncLookControls() {
    const diagView = ["My", "Mz", "N", "def"].includes(S.show);
    $$("[data-look]").forEach((b) => { b.disabled = diagView; b.setAttribute("aria-pressed", String(!diagView && b.dataset.look === S.look)); });
    $("#b-slabs").disabled = diagView || S.look !== "solid";
  }
  function setLook(l) {
    S.look = l; saveView();
    syncLookControls();
    V.rebuild(); V.refreshOverlay();
  }
  function init() {
    const ex3 = window.TRAGWERK_EXAMPLES3D || {};
    $("#b-preset").innerHTML = `<optgroup label="Generate a building">${Object.entries(PRESETS).map(([k, p]) => `<option value="${k}">${esc(p.label)}</option>`).join("")}</optgroup>
      ${Object.keys(ex3).length ? `<optgroup label="Open a model file">${Object.keys(ex3).map((k) => `<option value="ex:${esc(k)}">${esc(ex3[k].name || k)} (JSON)</option>`).join("")}</optgroup>` : ""}`;
    $("#b-preset").onchange = (e) => {
      const k = e.target.value;
      if (k.startsWith("ex:")) loadData(clone(ex3[k.slice(3)])); else load({ spec: PRESETS[k].spec });
    };
    $$("[data-btab]").forEach((t) => t.onclick = () => { S.btab = t.dataset.btab; renderEditor(); });
    $$("[data-rtab]").forEach((t) => t.onclick = () => { S.rtab = t.dataset.rtab; renderResults(); });
    $$("[data-show]").forEach((c) => c.onclick = () => setShow(c.dataset.show));
    $$("[data-look]").forEach((b) => b.onclick = () => setLook(b.dataset.look));
    $$("[data-cam]").forEach((b) => b.onclick = () => V.setCamera(b.dataset.cam));
    $("#b-slabs").checked = S.slabs;
    $("#b-slabs").onchange = (e) => { S.slabs = e.target.checked; saveView(); V.rebuild(); };
    $("#b-source").onchange = (e) => { S.source = e.target.value; V.refreshOverlay(); };
    $("#b-level").onchange = (e) => { S.level = e.target.value; V.rebuild(); V.refreshOverlay(); };
    $("#b-name").addEventListener("input", (e) => { if (S.spec) S.spec.name = e.target.value; else S.base.name = e.target.value; if (S.data) S.data.name = e.target.value; V.rebuild(); });
    $("#b-json").onclick = () => { $("#b-json-text").value = JSON.stringify(S.data, null, 2); $("#b-json-msg").textContent = ""; $("#b-drawer").hidden = false; $("#b-json-text").focus(); };
    $("#b-drawer-close").onclick = () => { $("#b-drawer").hidden = true; };
    $("#b-drawer").addEventListener("click", (e) => { if (e.target.id === "b-drawer") $("#b-drawer").hidden = true; });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("#b-drawer").hidden = true; } });
    $("#b-json-copy").onclick = () => {
      const t = $("#b-json-text");
      navigator.clipboard.writeText(t.value).then(() => { $("#b-json-msg").textContent = "Copied."; }, () => { t.select(); $("#b-json-msg").textContent = "Select all and copy with your keyboard."; });
    };
    $("#b-json-load").onclick = () => {
      try {
        const data = JSON.parse($("#b-json-text").value);
        if (data.schema !== T.SCHEMA3D) throw new Error(`expected schema '${T.SCHEMA3D}'; 2D models open in the 2D frame workspace`);
        T.parseModel3d(data);
        loadData(data); $("#b-drawer").hidden = true; toast("Model loaded.");
      } catch (e) { $("#b-json-msg").textContent = `Not loaded: ${e.message}`; }
    };
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (mq && mq.addEventListener) mq.addEventListener("change", () => V.theme());
    new MutationObserver(() => V.theme()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    $$("[data-show]").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.show === S.show)));
    syncLookControls();
    $("#b-ver").textContent = `v${T.VERSION}`;
    V.init();
    $("#b-preset").value = "office";
    S.spec = Object.assign(T.BUILDING_DEFAULTS(), clone(PRESETS.office.spec));
    renderEditor();
    $("#b-busy").hidden = false;
    setTimeout(() => { runNow(); V.setCamera("iso", true); }, 30);
    window.TragwerkStudio3D = { S, V, runNow, select };
  }
  init();
})();
</script>
<script>
(function () {
  "use strict";
  const modes = { "3d": document.getElementById("mode-3d"), "2d": document.getElementById("mode-2d") };
  function setMode(m) {
    if (!modes[m]) m = "3d";
    for (const [k, el] of Object.entries(modes)) el.hidden = k !== m;
    document.querySelectorAll(".modes [data-mode]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
    try { localStorage.setItem("tragwerk.mode", m); } catch (e) { /* storage unavailable */ }
    window.dispatchEvent(new Event("resize"));
  }
  document.querySelectorAll(".modes [data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  let m = "3d";
  try { m = localStorage.getItem("tragwerk.mode") || "3d"; } catch (e) { /* storage unavailable */ }
  setMode(m);
})();
</script>
